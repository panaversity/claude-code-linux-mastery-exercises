# Default environment variables for all agents
# Loaded by systemd for all agent services
# See: man environment.d(5)

NODE_ENV=production
PYTHON_ENV=production
LOG_LEVEL=INFO
TZ=UTC
LANG=en_US.UTF-8

# Shared Redis connection
REDIS_URL=redis://localhost:6379

# Shared PostgreSQL connection
DATABASE_URL=postgresql://agents:agents-prod-pw@localhost:5432/agents_db
