# Data Processor Pipeline Configuration
# NOTE: This is the LOCAL copy. The canonical config is at /etc/data-processor/pipeline.yaml
# This file may be out of date - always check /etc/ version.

pipeline:
  input_dir: /var/lib/data-processor/input
  output_dir: /var/lib/data-processor/output
  batch_size: 500
  schedule: "0 2 * * *"  # 2 AM daily

stages:
  - name: validate
    type: schema_check
    strict: true
  - name: transform
    type: normalize
    lowercase_fields: [name, email]
  - name: deduplicate
    type: dedup
    key_field: id
  - name: enrich
    type: lookup
    source: postgresql
    table: customer_metadata

database:
  url: postgresql://dataproc:dataproc-pw@localhost:5432/pipeline_db
  pool_size: 5

notifications:
  on_failure: ops-alerts@example.com
  on_success: null
