# Summarizer Agent Configuration
# WARNING: This config is in /tmp — it will be deleted on reboot!
# It should be in /etc/agent-app/config.yaml

server:
  host: 0.0.0.0
  port: 8080
  workers: 2

llm:
  model: gpt-4
  max_tokens: 1024
  temperature: 0.3

database:
  # BAD: This points to /root which requires root permissions
  path: /root/agent-data/database.sqlite

logging:
  level: INFO
  # BAD: Logging to a home directory instead of /var/log
  file: /home/admin/agent.log

ssl:
  enabled: true
  # BAD: Certs in /var/www which is for web content, not certs
  cert_path: /var/www/agent-certs/server.pem
  key_path: /var/www/agent-certs/server.key

data:
  # BAD: Temp directory for persistent data
  upload_dir: /tmp/agent-app/uploads
  cache_dir: /tmp/agent-app/cache
